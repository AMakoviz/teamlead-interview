version: '3.8'

services:
  postgres:
    image: postgres:14-alpine3.20
    container_name: teamlead-postgres
    shm_size: 128mb
    restart: always
    environment:
      POSTGRES_USER: jira
      POSTGRES_PASSWORD: jirapassword
      POSTGRES_DB: jiradb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jira_network

  jira:
    image: atlassian/jira-software:9.4.26
    container_name: teamlead-jira
    restart: always
    ports:
      - "8080:8080"
    environment:
      ATL_DB_DRIVER: org.postgresql.Driver
      ATL_DB_TYPE: postgres72
      ATL_JDBC_URL: jdbc:postgresql://teamlead-postgres:5432/jiradb
      ATL_JDBC_USER: jira
      ATL_JDBC_PASSWORD: jirapassword
      JVM_MINIMUM_MEMORY: 1024M
      JVM_MAXIMUM_MEMORY: 2048M
    depends_on:
      - postgres
    volumes:
      - jira_data:/var/atlassian/application-data/jira
    networks:
      - jira_network

volumes:
  postgres_data:
  jira_data:

networks:
  jira_network: